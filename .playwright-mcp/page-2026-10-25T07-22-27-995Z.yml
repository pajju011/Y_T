          - heading "1. Local Video Storage & Processing" [level=4] [ref=e2009]
          - paragraph [ref=e2010]:
            - text: All video files uploaded to ClipGenius AI are stored locally within your workspace under the
            - code [ref=e2011]: uploads/
            - text: directory on your host filesystem. We do not upload your video files to any third-party cloud hosting or analytics servers without your explicit connection.
        - generic [ref=e2012]:
          - heading "2. AI Provider Data Transmission" [level=4] [ref=e2013]
          - paragraph [ref=e2014]: When you choose to use Google Gemini or Groq API integrations, video metadata, duration, titles, and transcript snippets are transmitted strictly through your personal API keys to the respective provider's endpoints. Under Google AI Studio free tier terms, your prompts are processed in accordance with Google's API service terms. If you prefer 100% air-gapped processing, you can use ClipGenius AI's built-in Local Pattern Engine or Local Ollama.
        - generic [ref=e2015]:
          - heading "3. Social Account Connections & Credentials" [level=4] [ref=e2016]
          - paragraph [ref=e2017]:
            - text: ClipGenius AI does not collect, sell, or monetize user data. Connected channel handles and API tokens are stored solely in your local JSON database (
            - code [ref=e2018]: data/db.json
            - text: ). You retain absolute control over deleting any token or disconnecting any integration at any time.
        - generic [ref=e2019]:
          - heading "4. Data Deletion" [level=4] [ref=e2020]
          - paragraph [ref=e2021]: Deleting a video or clip within ClipGenius AI permanently purges both the database record and the underlying MP4 file from your disk.